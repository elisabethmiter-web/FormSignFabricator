{# Buttons that open the staff member's own email or phone with the message ready. Needs: p, qs (quick_message), kind, who #}
<div class="quick-send" data-nudge="{{ url_for('packet_nudge', pid=p.id) }}" data-kind="{{ kind }}" data-who="{{ who or '' }}" data-setapp="{{ url_for('set_email_app') }}">
  <span class="qs-email">
    <a class="btn {{ 'btn-primary' if primary }}" href="{{ qs.compose }}" data-via="email" data-main="1"{% if qs.compose_web %} target="_blank" rel="noopener"{% endif %} title="{{ 'Opens a new email with the message and link ready' if qs.email else 'Opens a new email with the message and link ready; add the address' }}">✉ Open in {{ qs.compose_label }}</a>
    <details class="qs-more"><summary class="btn {{ 'btn-primary' if primary }}" aria-label="Other email choices" title="Use another email">▾</summary>
      <div class="qs-menu">
        <span class="small muted">Open in:</span>
        {% for o in qs.others %}<a href="{{ o.url }}" data-via="email" data-app="{{ o.key }}"{% if o.key != 'app' %} target="_blank" rel="noopener"{% endif %}>{{ EMAIL_APPS[o.key][1] }}</a>{% endfor %}
        <span class="small muted">The one you pick becomes your default.</span>
      </div></details>
  </span>
  <a class="btn" href="{{ qs.sms }}" data-via="phone" title="On a phone: opens your text messages with the message ready">💬 Text from my phone</a>
  <button type="button" class="btn btn-quiet" data-via="copy" data-text="{{ qs.body }}">Copy message</button>
</div>
